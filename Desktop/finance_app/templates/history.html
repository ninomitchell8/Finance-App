{% extends "layout.html" %}

{% block title %}

    History

{% endblock %}

{% block main %}

<table style = "width : 100%">
    <tr>
        <th>Symbol</th>
        <th>Shares</th>
        <th>Price</th>
        <th>Transacted</th>
    </tr>

    {% for row in transactions %}
    <tr>
        <td>{{row.symbol}}</td>
        <td>{{row.shares}}</td>
        <td>{{row.price | usd}}</td>
        <td>{{row.date}}</td>
    </tr>
    {% endfor %}
</table>

<table style ="width : 160%">


{% endblock %}
