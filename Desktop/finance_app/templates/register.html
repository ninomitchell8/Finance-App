{% extends "layout.html" %}

{% block title %}
    Register
{% endblock %}

{% block main %}
    <form action = "/register" method = "post">
        <div class = "mb-3">
            <input autocomplete = "off" autofocus = "form-control mx-auto w-auto" name = "username" placeholder="Create Username" type = "text">
        </div>
        <div class = "mb-3">
            <input autofocus = "form-control mx-auto w-auto" name = "password" placeholder="Create Password" type = "text">
        </div>
        <div>
            <input autofocus = "form-control mx-auto w-auto" name = "confirmation" placeholder="Confirm Password" type = "text">
        </div>
        
        <button class = "btn btn-primary" type = "submit">Register</button>
    </form>
{% endblock %}
